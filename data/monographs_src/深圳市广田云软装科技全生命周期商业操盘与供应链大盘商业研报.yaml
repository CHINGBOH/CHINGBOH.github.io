  orig: ——全资子公司从0到1组建 45 人团队，统筹十大标杆项目与 135 份契约所承载的全周期工程实录
  text: ——十年定制软装供货商务实录：自业务承接到摆场回款的全链路统筹、成本精算与履约兑现
- key: s08
  kind: p
  tag: p
  parent: container
  orig: 深圳市广田云软装科技（深圳市广田软装艺术有限公司）是广田集团旗下全资子公司，本专案实录梁清波自 2014 年 2 月至 2024 年 2 月历时十年的全周期深耕经历。
  text: 深圳市广田云软装科技（深圳市广田软装艺术有限公司）是广田集团旗下全资子公司，本专案实录梁清波自 2014 年 2 月至 2024 年 2 月历时十年的全周期深耕经历。
- key: s09
  kind: p
  tag: p
  parent: container
  orig: <strong>初创奠基期（2014.02–2015.02）</strong>：作为筹办与初创负责人，承接集团超募资金 3,000 万元设立公司的成果，从 0 到 1 组建 45 人团队（设计 18 / 工程 12 / 商务 8 / 综合 7），主笔《广田云软装制度》八大模块 730 条条款、28 类审批流与底薪提成双轨制，打造 1,491 ㎡ 艺展中心展厅，实现劳动合同 100% 签署、十年零劳动仲裁。
  text: '**初创奠基期（2014.02–2015.02）**：作为筹办与初创负责人，承接集团超募资金 3,000 万元设立公司的成果，从 0 到 1 组建 45 人团队（设计 18 / 工程 12 / 商务 8 / 综合 7），主笔《广田云软装制度》八大模块 730 条条款、28 类审批流与底薪提成双轨制，打造 1,491 ㎡ 艺展中心展厅，实现劳动合同 100% 签署、十年零劳动仲裁。'
- key: s10
  kind: p
  tag: p
  parent: container
  orig: <strong>大项目牵头期（2015–2024）</strong>：以重大标杆项目为专班战元，跨设计/工程/造价/采购拉通专业力量、端到端下沉一线，统筹全盘 <strong>135 份盖章合同（签约 6.83 亿元，锁定产值 5.92 亿元）</strong>，覆盖遵义三大破亿工程（遵义大酒店 1.25 亿 / 汇川康养城 1.09 亿 / 遵义开元名都 1.03 亿）、仁怀温泉小镇、景德镇婺源婺女洲及全国五星酒店集群；主抓采销双轨调价（锁定 30%~35% 毛利）、四维资金回款防线与多轮竣工结算抗辩。其中 24 个代表性标杆工程为全盘合同的骨干子集。
  text: '**商务全链实战期（2015–2024）**：主营窗帘、地毯、挂画、艺术品、灯具等定制软装货品的采购供货业务。统筹百余份供货合同的履约，覆盖大型酒店、公建、文旅与房企战采等项目类型；每一单自业务承接、报价测算、深化下单、采购供货，至现场摆场、配合验收、结算回款，均全程统筹；主抓采销双轨调价、资金回款风控与多轮竣工结算抗辩。'

  parent: container
  orig: <strong>45 人跨职能团队矩阵</strong>：从 0 到 1 组建方案设计（18人）、工程交付（12人）、商务采销（8人）与行政综合（7人）四大序列，专业序列占比超 66.7%；
  text: '**45 人跨职能团队矩阵**：从 0 到 1 组建方案设计（18人）、工程交付（12人）、商务采销（8人）与行政综合（7人）四大序列，专业序列占比超 66.7%；'
- key: s65
  kind: li
  tag: li
  parent: container
  orig: <strong>八大模块 730 条制度总纲</strong>：起草《广田云软装制度》，涵盖考勤、奖惩、招聘、培训、薪酬等八大板块，建立 28 类标准审批节点，实现流程化提效；
  text: '**八大模块 730 条制度总纲**：起草《广田云软装制度》，涵盖考勤、奖惩、招聘、培训、薪酬等八大板块，建立 28 类标准审批节点，实现流程化提效；'
- key: s66
  kind: li
  tag: li
  parent: container
  orig: <strong>薪酬提成双轨与用工零仲裁</strong>：推行月薪+提成+年薪双轨制，提成与回款进度强绑定，劳动合同与社保 100% 签署，十年保持零用工诉讼与劳动仲裁。
  text: '**薪酬提成双轨与用工零仲裁**：推行月薪+提成+年薪双轨制，提成与回款进度强绑定，劳动合同与社保 100% 签署，十年保持零用工诉讼与劳动仲裁。'
- key: s67
  kind: sec-heading
  tag: h3
  parent: container
  orig: § 2 大项目敏捷专班与实战下沉 (Agile Task Force & Hands-on Leadership)
  text: § 2 大项目敏捷专班与实战下沉 (Agile Task Force & Hands-on Leadership)
- key: s68
  kind: li
  tag: li
  parent: container
  orig: <strong>重大项目跨部门专班制</strong>：打破传统部门壁垒与冗余科层，以破亿级标杆交付为战元，项目总牵头跨职能动态抽调设计深化、工程驻场、造价与采销精锐组建攻坚突击队；
  text: '**重大项目跨部门专班制**：打破传统部门壁垒与冗余科层，以大型标杆交付为战元，项目总牵头跨职能动态抽调设计深化、工程驻场、造价与采销精锐组建攻坚突击队；'
- key: s69
  kind: li
  tag: li
  parent: container
  orig: <strong>全链条端到端实操操盘</strong>：坚持深入一线实战，从前期大客户商务谈判、严密合同条款拟定，到中期驻场交底与关键工序穿插协调，亲力亲为穿透全生命周期；
  text: '**供货全链路深度主导**：坚持深入一线，前期主导业务承接、投标报价与采购合同条款拟定，中期推进深化下单、工厂排产出货与驻场交底，后期把控现场摆场安装、配合设计师验收、签证留底与结算回款，全程穿透每一单的完整生命周期；'
- key: s70
  kind: li
  tag: li
  parent: container
  orig: <strong>源头工厂品质飞检把关</strong>：亲赴定制家具源头工厂进行出厂前白胚结构与面漆封闭飞检，确保平顶山温德姆、平度雅高美爵等国际品牌联检一次性封样过关。
  text: '**源头工厂品质飞检把关**：亲赴定制家具源头工厂进行出厂前白胚结构与面漆封闭飞检，确保平顶山温德姆、平度雅高美爵等国际品牌联检一次性封样过关。'
- key: s71
  kind: sec-heading
  tag: h3
  parent: container
  orig: § 3 采销双轨报价与多轮调价控制 (Dual-Track Pricing & Margin Control)
  text: § 3 采销双轨报价与多轮调价控制 (Dual-Track Pricing & Margin Control)
- key: s72
  kind: li
  tag: li
  parent: container
  orig: <strong>买入成本裸价 vs 卖出工程报价</strong>：工厂出厂裸价前置锁定，结合运杂费(10%)、税金(11%)与综合业务费(12%)计算测算毛利，杜绝跑冒滴漏；
  text: '**买入成本裸价 vs 卖出工程报价**：工厂出厂裸价前置锁定，结合运杂费(10%)、税金(11%)与综合业务费(12%)计算测算毛利，杜绝跑冒滴漏；'
- key: s73
  kind: li
  tag: li
  parent: container
  orig: <strong>多轮调价与抗压博弈</strong>：在多轮送审与认价调价拉锯中，以工艺选型平替与批量排产优化为筹码，始终坚守 30%~35% 经营毛利率红线；
  text: '**多轮调价与抗压博弈**：在多轮送审与认价调价拉锯中，以工艺选型平替与批量排产优化为筹码，始终坚守 30%~35% 经营毛利率红线；'
- key: s74
  kind: li
  tag: li
  parent: container
  orig: <strong>规模集采降本杠杆</strong>：通过整合全国多项目同品类家具、灯具面料集采，争取工厂让利 8%~12%，撬动项目预估净利润显著激增。
  text: '**规模集采降本杠杆**：通过整合全国多项目同品类家具、灯具面料集采，争取工厂让利 8%~12%，撬动项目预估净利润显著激增。'
- key: s75
  kind: sec-heading
  tag: h3
  parent: container
  orig: § 4 四维资金回款与供应链防线 (Four-Dimensional Cashflow Defense)
  text: § 4 四维资金回款与供应链防线 (Four-Dimensional Cashflow Defense)
- key: s76
  kind: li
  tag: li
  parent: container
  orig: <strong>比例联动回款模型</strong>：针对遵义大酒店等超大型工程，约定“分包应收款 = 母公司实收 × [1500 ÷ 6000]”刚性联动，贴现成本共担，防范支付推诿；
  text: '**比例联动回款模型**：针对大型工程，约定分包应收款与母公司实收款按合同约定比例刚性联动，贴现成本共担，防范支付推诿；'
- key: s77
  kind: li
  tag: li
  parent: container
  orig: <strong>阶段节点确权模型</strong>：针对湄潭、海南生态园等项目，执行 30% 预付 + 80% 形象进度 + 95% 验收确权，按月度监理确权闭环，出货前锁定 80% 现金流；
  text: '**阶段节点确权模型**：针对湄潭、海南生态园等项目，执行 30% 预付 + 80% 形象进度 + 95% 验收确权，按月度监理确权闭环，出货前锁定 80% 现金流；'
- key: s78
  kind: li
  tag: li
  parent: container
  orig: <strong>极速出厂覆盖模型</strong>：针对上海华泰、宾阳华美达等高周转项目，出厂前提货款付至 70%~90%，以甲方付款刚性覆盖直接出厂成本，实现零垫资运作；
  text: '**极速出厂覆盖模型**：针对上海华泰、宾阳华美达等高周转项目，出厂前提货款付至 70%~90%，以甲方付款刚性覆盖直接出厂成本，实现零垫资运作；'
- key: s79
  kind: li
  tag: li
  parent: container
  orig: <strong>五轮送审答辩确权</strong>：重构签证联系单、原厂代换凭据与实测实量底账，亲自挂帅审计抗辩，确保遵义 9300 万审定、红花岗 2200 万资产对冲锁定。
  text: '**五轮送审答辩确权**：重构签证联系单、原厂代换凭据与实测实量底账，亲自挂帅审计抗辩，确保遵义 9300 万审定、红花岗 2200 万资产对冲锁定。'

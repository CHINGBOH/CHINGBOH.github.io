  orig: 【重大工程专班总操盘】统领全盘 135 份真实盖章合同大盘（签约 6.83 亿元，确权产值 5.92 亿元），打破传统科层以重大工程为战元牵头跨部门敏捷专班，主揽并总操盘遵义大酒店（1.25 亿国宾工程）、开元名都（1.03 亿）、汇川康养城（1.09 亿）等 24 项标杆工程全流程高品质交付。
  text: 【重大工程专班总统筹】统领全盘 135 份真实盖章合同大盘（签约 6.83 亿元，确权产值 5.92 亿元），打破传统科层以重大工程为战元牵头跨部门敏捷专班，主揽并总统筹遵义大酒店（1.25 亿国宾工程）、开元名都（1.03 亿）、汇川康养城（1.09 亿）等 24 项标杆工程全流程高品质交付。

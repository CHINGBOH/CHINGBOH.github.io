  orig: "\n            <span style=\"display: inline-block; font-family: 'Noto Serif SC', serif; font-size: 15.5px; font-weight: 700; color: var(--accent-navy); background: rgba(22, 42, 69, 0.04); border: 1px solid rgba(22, 42, 69, 0.12); padding: 5px 14px; border-radius: var(--radius-sm); letter-spacing: 0.04em; box-shadow: 0 1px 2px rgba(18, 19, 22, 0.02);\">\n                全资子公司初创奠基 · 大宗商业工程总操盘 · 数字化解决方案顾问 · 华中科技大学统计学\n            </span>\n        "
  text: "\n            \n                全资子公司初创奠基 · 大宗商业工程总操盘 · 数字化解决方案顾问 · 华中科技大学统计学\n            \n        "
- key: s09
  kind: block
  tag: div
  parent: container
  orig: "\n            在高度非标、多方博弈的复杂商业环境中，依靠数理逻辑与机制设计建立确定性：在商业操盘上，穿透成本底盘与多级定价博弈，锁定 30%~35% 稳健经营毛利与四维资金回款；在组织治理上，从 0 到 1 建章立制，以制度总纲与敏捷专班保障长周期合规与零仲裁运营；在数字化落地中，将实体大盘中验证过的业务规则与经营闭环，沉淀为现代软件系统、Agent 状态机与分析引擎。华中科技大学纯数统计推断、上市公司治理与全资子公司十年实操，构成上述价值交付的坚实基石。\n\n        "
  text: "\n            在高度非标、多方博弈的复杂商业环境中，依靠数理逻辑与机制设计建立确定性：在商业统筹上，穿透成本底盘与多级定价博弈，锁定 30%~35% 稳健经营毛利与四维资金回款；在组织治理上，从 0 到 1 建章立制，以制度总纲与敏捷专班保障长周期合规与零仲裁运营；在数字化落地中，将实体大盘中验证过的业务规则与经营闭环，沉淀为现代软件系统、Agent 状态机与分析引擎。华中科技大学纯数统计推断、上市公司治理与全资子公司十年实操，构成上述价值交付的坚实基石。\n\n        "

  kind: li
  tag: li
  parent: container
  orig: <strong>签约即付 30% 定金</strong>：合同签订 3 个工作日内到账 47.00 万元，直接启动工厂排产与定金锁定；
  text: '**签约即付 30% 定金**：合同签订 3 个工作日内到账 47.00 万元，直接启动工厂排产与定金锁定；'
- key: s58
  kind: li
  tag: li
  parent: container
  orig: <strong>出货前付至 70% 刚性阀门</strong>：大货出厂前严格执行查验打款，回收 62.66 万元，累计收回 109.66 万元；
  text: '**出货前付至 70% 刚性阀门**：大货出厂前严格执行查验打款，回收 62.66 万元，累计收回 109.66 万元；'
- key: s59
  kind: li
  tag: li
  parent: container
  orig: <strong>出货前回笼覆盖直接成本</strong>：以 109.66 万元全额刚性覆盖直接采购与干线物流(79.66万)，彻底消除呆死账风险。
  text: '**出货前回笼覆盖直接成本**：以 109.66 万元全额刚性覆盖直接采购与干线物流(79.66万)，彻底消除呆死账风险。'

  orig: <strong>穿透珠三角产业集群</strong>：跳过中间二道贩子，直连东莞大岭山家具厂与中山古镇灯具厂，获取源头白胚裸价；
  text: '**穿透珠三角产业集群**：跳过中间二道贩子，直连东莞大岭山家具厂与中山古镇灯具厂，获取源头白胚裸价；'

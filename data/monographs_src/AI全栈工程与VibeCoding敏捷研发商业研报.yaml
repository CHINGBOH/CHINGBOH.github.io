  parent: container
  orig: "\n            Vibe Coding 的价值不在「生成代码」——单点生成代码门槛已极低；真正的稀缺能力，是用 <strong>LLM 与 Harness 作为支点，撬动项目 Context 这跟撑杆</strong>，把「数据处理」变成可交付的「工程成果」。整套湖仓视图体系（<code>v_vibe_engineering_overview</code> / <code>v_survey_engineering_evidence</code> / bronze 底账）正是这一原理的实证载体：散落各处的 Context 被压缩、索引、复用进 DuckDB，才能被 LLM（理解）与 Harness（执行）随时撬动。\n        "
  text: "\n            Vibe Coding 的价值不在「生成代码」——单点生成代码门槛已极低；真正的稀缺能力，是用 **LLM 与 Harness 作为支点，撬动项目 Context 这跟撑杆**，把「数据处理」变成可交付的「工程成果」。整套湖仓视图体系（`v_vibe_engineering_overview` / `v_survey_engineering_evidence` / bronze 底账）正是这一原理的实证载体：散落各处的 Context 被压缩、索引、复用进 DuckDB，才能被 LLM（理解）与 Harness（执行）随时撬动。\n        "

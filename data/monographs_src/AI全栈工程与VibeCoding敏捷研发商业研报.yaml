  orig: "\n            <strong>全篇立论</strong>　AI 的价值不只在\"写代码\"，更在<strong>你给它多少梳理好的背景资料</strong>。我把平时积累的知识、方法、数据都整理好存进一个\"资料库\"，AI 需要时随时调用——给它喂得越清楚，它干得越靠谱。下文的工程方法（§ 2）、统计分析（§ 3）、数据看板（§ 4），本质都是这样：<strong>先把背景整理明白，再让 AI 照着做，最后把成果落地</strong>。本研报所有关键数字，都能在资料库里查证复核。\n        "
  text: "\n            **全篇立论**　AI 的价值不只在\"写代码\"，更在**你给它多少梳理好的背景资料**。我把平时积累的知识、方法、数据都整理好存进一个\"资料库\"，AI 需要时随时调用——给它喂得越清楚，它干得越靠谱。下文的工程方法（§ 2）、统计分析（§ 3）、数据看板（§ 4），本质都是这样：**先把背景整理明白，再让 AI 照着做，最后把成果落地**。本研报所有关键数字，都能在资料库里查证复核。\n        "

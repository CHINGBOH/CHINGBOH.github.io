  orig: "\n            本案例最有价值的一步是<strong>反向审计</strong>：对 AI 装配的研报初稿逐格核对原始 ODS 表格后，发现若干\"正文结论与表格数字不符\"（如把 p=0.90 的不显著系数写成 p&lt;0.001 的显著结论、置信区间跨 1 的 OR 被解读为因果）。由此确立<strong>\"以引擎原始表格为唯一数字真源，叙事文字必须与断言区间一致\"</strong>的质检规则，并将显著性表述统一为学术规范（*/**/***/ns）。这正是统计学专业背景在 Vibe Coding 流程中作为\"AI 幻觉终结者\"的直接体现。\n        "
  text: "\n            本案例最有价值的一步是**反向审计**：对 AI 装配的研报初稿逐格核对原始 ODS 表格后，发现若干\"正文结论与表格数字不符\"（如把 p=0.90 的不显著系数写成 p<0.001 的显著结论、置信区间跨 1 的 OR 被解读为因果）。由此确立**\"以引擎原始表格为唯一数字真源，叙事文字必须与断言区间一致\"**的质检规则，并将显著性表述统一为学术规范（*/**/***/ns）。这正是统计学专业背景在 Vibe Coding 流程中作为\"AI 幻觉终结者\"的直接体现。\n        "

  orig: "\n            一句话，就是<strong>\"给 AI 讲清楚背景，剩下的活交给它\"</strong>：我负责把项目怎么回事讲明白，AI 负责把代码写出来，再用严格的检查兜底，不让它乱跑。这不是放任不管，而是有章法的协作。\n        "
  text: "\n            一句话，就是**\"给 AI 讲清楚背景，剩下的活交给它\"**：我负责把项目怎么回事讲明白，AI 负责把代码写出来，再用严格的检查兜底，不让它乱跑。这不是放任不管，而是有章法的协作。\n        "
- key: s68
  kind: block
  tag: div

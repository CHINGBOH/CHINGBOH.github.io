- key: s10
  kind: p
  tag: p
  parent: container
  orig: "\n            我的工作方式很朴素：<strong>自己定思路和标准，让 AI 负责动手干活</strong>。一个人就能完成从写代码、搭系统、做数据分析到上线运行的全流程。这个能力根植于计算机专业功底，用在真实业务上——从<strong>外贸获客、工程造价、CAD 制图，到消费券问卷的统计分析（SAS / SPSS / R）</strong>，再到<strong>出海拓客的数据看板（Superset / FineBI / n8n）</strong>，都做出了能实际跑起来的成果。全程<strong>一个人，一套思路，落地多个领域</strong>。"
  text: "\n            我的工作方式很朴素：**自己定思路和标准，让 AI 负责动手干活**。一个人就能完成从写代码、搭系统、做数据分析到上线运行的全流程。这个能力根植于计算机专业功底，用在真实业务上——从**外贸获客、工程造价、CAD 制图，到消费券问卷的统计分析（SAS / SPSS / R）**，再到**出海拓客的数据看板（Superset / FineBI / n8n）**，都做出了能实际跑起来的成果。全程**一个人，一套思路，落地多个领域**。"

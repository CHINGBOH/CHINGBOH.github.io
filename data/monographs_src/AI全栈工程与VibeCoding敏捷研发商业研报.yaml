  orig: <strong>DuckDB 扩展插件深度集成</strong>：熟练运用 <code>vss</code> 向量相似度插件（HNSW 索引与余弦距离）在数据库内直接实现混合检索；基于 <code>httpfs</code> 插件实现对远端 S3 / HTTPS 上的 Parquet/CSV 进行免 ETL 零拷贝直读（谓词下推与 Range 剪裁）；通过 <code>scanner</code> 插件与 <code>spatial</code> 空间几何库实现跨源异构联邦与 CAD/GIS 分析；
  text: '**DuckDB 扩展插件深度集成**：熟练运用 `vss` 向量相似度插件（HNSW 索引与余弦距离）在数据库内直接实现混合检索；基于 `httpfs` 插件实现对远端 S3 / HTTPS 上的 Parquet/CSV 进行免 ETL 零拷贝直读（谓词下推与 Range 剪裁）；通过 `scanner` 插件与 `spatial` 空间几何库实现跨源异构联邦与 CAD/GIS 分析；'

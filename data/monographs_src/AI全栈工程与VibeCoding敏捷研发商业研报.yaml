  orig: <strong>Model Context Protocol (MCP) 统一数据总线</strong>：基于 <code>mcp-server-duckdb</code> 与 FastMCP 封装标准 MCP 工具集（<code>read_query</code>, <code>describe_table</code>, <code>list_tables</code>），配合 <code>--readonly</code> 严格安全沙箱，赋予 AI Agent 对本地及远程湖仓高效、确定性的即席分析与工具闭环能力；
  text: '**Model Context Protocol (MCP) 统一数据总线**：基于 `mcp-server-duckdb` 与 FastMCP 封装标准 MCP 工具集（`read_query`, `describe_table`, `list_tables`），配合 `--readonly` 严格安全沙箱，赋予 AI Agent 对本地及远程湖仓高效、确定性的即席分析与工具闭环能力；'

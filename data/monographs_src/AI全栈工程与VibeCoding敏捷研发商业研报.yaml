  orig: "\n            这一节不讲工具，讲<strong>统计判断本身</strong>——每一行结论背后是一整套\"先验前提 → 检验 → 解读 → 稳健性兜底\"的实证链条，全部在 SAS 9.4 官方云端真跑、ODS 原始输出留证。\n        "
  text: "\n            这一节不讲工具，讲**统计判断本身**——每一行结论背后是一整套\"先验前提 → 检验 → 解读 → 稳健性兜底\"的实证链条，全部在 SAS 9.4 官方云端真跑、ODS 原始输出留证。\n        "
- key: s146
  kind: sec-heading
  tag: h3
  parent: container
  orig: ① 测量质量把关：信度 + 效度 + 正态性 三层设防
  text: ① 测量质量把关：信度 + 效度 + 正态性 三层设防
- key: s147
  kind: li
  tag: li
  parent: container
  orig: <strong>验什么</strong>：问卷量表先过"测得好不好"这一关,才谈分析；
  text: '**验什么**：问卷量表先过"测得好不好"这一关,才谈分析；'
- key: s148
  kind: li
  tag: li
  parent: container
  orig: <strong>怎么做</strong>：PROC CORR 求 Cronbach's α=0.8819 信度；结合 KMO/Bartlett 效度；PROC UNIVARIATE 检验偏度(|·|&lt;0.5)/峰度(|·|&lt;0.35) 论证参数检验前提；
  text: '**怎么做**：PROC CORR 求 Cronbach''s α=0.8819 信度；结合 KMO/Bartlett 效度；PROC UNIVARIATE 检验偏度(|·|<0.5)/峰度(|·|<0.35) 论证参数检验前提；'
- key: s149
  kind: li
  tag: li
  parent: container
  orig: <strong>发现什么</strong>：量表内部一致性、取样充分性、正态性三项全部达标，为后续 t/ANOVA/回归铺平统计前提——这是避免"先下结论、后补检验"的严谨起点。
  text: '**发现什么**：量表内部一致性、取样充分性、正态性三项全部达标，为后续 t/ANOVA/回归铺平统计前提——这是避免"先下结论、后补检验"的严谨起点。'
- key: s150
  kind: sec-heading
  tag: h3
  parent: container
  orig: ② 组间差异验证：参数 + 非参数双引擎互证
  text: ② 组间差异验证：参数 + 非参数双引擎互证
- key: s151
  kind: li
  tag: li
  parent: container
  orig: <strong>验什么</strong>：生活费高低、性别是否显著影响用券水平；
  text: '**验什么**：生活费高低、性别是否显著影响用券水平；'
- key: s152
  kind: li
  tag: li
  parent: container
  orig: <strong>怎么做</strong>：PROC TTEST（参数 t 检验）与 Wilcoxon 秩和（非参，对序数/偏态稳健）双跑，避免单一检验被分布假设绑架；
  text: '**怎么做**：PROC TTEST（参数 t 检验）与 Wilcoxon 秩和（非参，对序数/偏态稳健）双跑，避免单一检验被分布假设绑架；'
- key: s153
  kind: li
  tag: li
  parent: container
  orig: <strong>发现什么</strong>：性别增量 p=0.49 不显著、生活费×用券卡方 p=0.76 无显著倾向——<strong>诚实地承认"无差异"</strong>，比勉强凑显著更难、也更可信。
  text: '**发现什么**：性别增量 p=0.49 不显著、生活费×用券卡方 p=0.76 无显著倾向——**诚实地承认"无差异"**，比勉强凑显著更难、也更可信。'
- key: s154
  kind: sec-heading
  tag: h3
  parent: container
  orig: ③ 拉动机制建模：方差分析 + 多元回归 定位强杠杆
  text: ③ 拉动机制建模：方差分析 + 多元回归 定位强杠杆
- key: s155
  kind: li
  tag: li
  parent: container
  orig: <strong>验什么</strong>：什么变量真正拉动消费券使用；
  text: '**验什么**：什么变量真正拉动消费券使用；'
- key: s156
  kind: li
  tag: li
  parent: container
  orig: <strong>怎么做</strong>：PROC GLM 做 ANOVA F=3.60 (p=0.0074) + Tukey HSD 多重比较（定位组间具体差异）；PROC REG 建 OLS（R²=0.2686, F=7.40），累计节省 B=0.384 (p&lt;0.0001)、使用频次 (p=0.018) 达显著，全程 VIF&lt;1.5 排除共线性；
  text: '**怎么做**：PROC GLM 做 ANOVA F=3.60 (p=0.0074) + Tukey HSD 多重比较（定位组间具体差异）；PROC REG 建 OLS（R²=0.2686, F=7.40），累计节省 B=0.384 (p<0.0001)、使用频次 (p=0.018) 达显著，全程 VIF<1.5 排除共线性；'
- key: s157
  kind: li
  tag: li

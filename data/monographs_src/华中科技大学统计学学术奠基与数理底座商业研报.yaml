  orig: 粒子沿离散速度方向位移至邻域格点 <code>f_i(x+e_i·Δt) = f_i^*</code>。无矩阵求逆，本质是连续内存指针位移。
  text: 粒子沿离散速度方向位移至邻域格点 `f_i(x+e_i·Δt) = f_i^*`。无矩阵求逆，本质是连续内存指针位移。

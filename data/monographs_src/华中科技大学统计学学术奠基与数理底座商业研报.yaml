  orig: 计算各格点粒子松弛弛豫 <code>f_i^* = f_i - (1/τ)[f_i - f_i^(eq)]</code>。格点间局部计算解耦，具备良好的数组并行性。
  text: 计算各格点粒子松弛弛豫 `f_i^* = f_i - (1/τ)[f_i - f_i^(eq)]`。格点间局部计算解耦，具备良好的数组并行性。

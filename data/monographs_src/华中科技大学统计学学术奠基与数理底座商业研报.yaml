  text: '**学院沿革与学科定位**'
- key: s45
  kind: table-cell
  tag: td
  parent: container
  orig: "\n                        华中科技大学（原华中理工大学、同济医科大学、武汉城市建设学院于 2000 年合并组建，国家首批“985工程”顶尖高校）。<br>\n                        数学学科历经华中工学院基础科学系、1984年数学力学系、1997年应用数学系。<strong>2002 年正式成立数学与统计学院，2002 级为首届统计学本科生</strong>。\n                    "
  text: "\n                        华中科技大学（原华中理工大学、同济医科大学、武汉城市建设学院于 2000 年合并组建，国家首批“985工程”顶尖高校）。\n\n                        数学学科历经华中工学院基础科学系、1984年数学力学系、1997年应用数学系。**2002 年正式成立数学与统计学院，2002 级为首届统计学本科生**。\n                    "
- key: s46
  kind: table-cell
  tag: td
  parent: container
  orig: "\n                        <strong>专业骨干师资教学投入</strong><br>\n                        修读由万建平教授、刘次华教授等编写的国家规划教材，系统接受概率公理化体系、参数估计与统计推断大题推导训练。\n                    "
  text: "\n                        **专业骨干师资教学投入**\n\n                        修读由万建平教授、刘次华教授等编写的国家规划教材，系统接受概率公理化体系、参数估计与统计推断大题推导训练。\n                    "
- key: s47
  kind: table-cell
  tag: td
  parent: container
  orig: <strong>理学培养标准 (非经管)</strong>
  text: '**理学培养标准 (非经管)**'
- key: s48
  kind: table-cell
  tag: td
  parent: container
  orig: "\n                        行政隶属数学系，严格执行<strong>理学学士 (Bachelor of Science)</strong> 标准。从大一到大二直接与数学与应用数学专业完全并轨修读高强度的《数学分析 (I/II/III)》与《高等代数与几何 (I/II)》，共 33 学分。\n                    "
  text: "\n                        行政隶属数学系，严格执行**理学学士 (Bachelor of Science)** 标准。从大一到大二直接与数学与应用数学专业完全并轨修读高强度的《数学分析 (I/II/III)》与《高等代数与几何 (I/II)》，共 33 学分。\n                    "
- key: s49
  kind: table-cell
  tag: td
  parent: container
  orig: "\n                        <strong>严密逻辑与推导思维</strong><br>\n                        深入实数完备性定理、Jordan 标准型与极限定理推导，对长链条业务逻辑与复杂数据关系建立严密的审慎核验习惯。\n                    "
  text: "\n                        **严密逻辑与推导思维**\n\n                        深入实数完备性定理、Jordan 标准型与极限定理推导，对长链条业务逻辑与复杂数据关系建立严密的审慎核验习惯。\n                    "
- key: s50
  kind: table-cell
  tag: td
  parent: container
  orig: <strong>华科工科底蕴融合</strong>
  text: '**华科工科底蕴融合**'
- key: s51
  kind: table-cell
  tag: td
  parent: container
  orig: "\n                        依托华科工科建模与计算机应用氛围，修读《C 语言程序设计》《数据结构与算法》《数值分析》《运筹学与线性规划》《常微分方程》《偏微分方程数值解》及 MATLAB/SAS 上机。\n                    "
  text: "\n                        依托华科工科建模与计算机应用氛围，修读《C 语言程序设计》《数据结构与算法》《数值分析》《运筹学与线性规划》《常微分方程》《偏微分方程数值解》及 MATLAB/SAS 上机。\n                    "
- key: s52
  kind: table-cell
  tag: td
  parent: container
  orig: "\n                        <strong>底层内存与算法实现基础</strong><br>\n                        系统掌握指针连续内存分配、数组局部性与大规模数值矩阵计算，为后续理解 DuckDB 列式计算与数据流转打下扎实功底。\n                    "
  text: "\n                        **底层内存与算法实现基础**\n\n                        系统掌握指针连续内存分配、数组局部性与大规模数值矩阵计算，为后续理解 DuckDB 列式计算与数据流转打下扎实功底。\n                    "
- key: s53
  kind: table-cell
  tag: td
  parent: container
  orig: <strong>毕业科研论文课题</strong>
  text: '**毕业科研论文课题**'
- key: s54
  kind: table-cell
  tag: td
  parent: container
  orig: "\n                        大四阶段师从计算数学与数值解导师团队，开展毕业设计：<strong>《格子玻尔兹曼 (LBM) 算法与流体力学数值模拟》</strong>（采用 D2Q9 离散速度网格模型与 LBGK 单松弛时间演化方程）。\n                    "
  text: "\n                        大四阶段师从计算数学与数值解导师团队，开展毕业设计：**《格子玻尔兹曼 (LBM) 算法与流体力学数值模拟》**（采用 D2Q9 离散速度网格模型与 LBGK 单松弛时间演化方程）。\n                    "
- key: s55
  kind: table-cell
  tag: td
  parent: container
  orig: "\n                        <strong>介观状态机与离散演化模型</strong><br>\n                        突破传统宏观连续方程全局求逆的计算瓶颈，理解微观局部规则向宏观连续介质演化的离散状态机机理，为后续理解复杂状态机与数据流编排提供良好认知。\n                    "
  text: "\n                        **介观状态机与离散演化模型**\n\n                        突破传统宏观连续方程全局求逆的计算瓶颈，理解微观局部规则向宏观连续介质演化的离散状态机机理，为后续理解复杂状态机与数据流编排提供良好认知。\n                    "

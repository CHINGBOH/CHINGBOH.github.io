  text: '**数理学术内核**：彻底超越浅层工科微积分公式套用，深入 ε-δ 极限实数完备性定理、含参变量积分、Green/Gauss 场论公式；线性空间同构、特征子空间分解、Jordan 标准型与二次型正定性判别。'

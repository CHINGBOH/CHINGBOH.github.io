  orig: 上市公司合规资本运作
  text: 上市公司合规资本运作
- key: s297
  kind: block
  tag: div
  parent: container
  orig: "\n                    <strong>运用统计推断与逻辑严密性，支撑法定信息披露与财务对标</strong><br>\n                    • <strong>433 行同业财报对标专报</strong>：运用多元回归与残差分析，对标金螳螂、亚厦、洪涛三项费用控制与毛利弹性；<br>\n                    • <strong>12 亿发债 55 类专业底稿</strong>：以审计级假设检验与方差复核，确保发债资产现金流测算严密闭环；<br>\n                    • <strong>深交所 206 篇法定公告</strong>：专职期间保持零监管函件、零行政处罚，深交所信息披露考评持续最高 A 级。\n                "
  text: "\n                    **运用统计推断与逻辑严密性，支撑法定信息披露与财务对标**\n\n                    • **433 行同业财报对标专报**：运用多元回归与残差分析，对标金螳螂、亚厦、洪涛三项费用控制与毛利弹性；\n\n                    • **12 亿发债 55 类专业底稿**：以审计级假设检验与方差复核，确保发债资产现金流测算严密闭环；\n\n                    • **深交所 206 篇法定公告**：专职期间保持零监管函件、零行政处罚，深交所信息披露考评持续最高 A 级。\n                "

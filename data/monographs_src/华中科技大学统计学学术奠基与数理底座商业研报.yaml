  orig: LATTICE BOLTZMANN METHOD (LBGK / D2Q9)
  text: LATTICE BOLTZMANN METHOD (LBGK / D2Q9)
- key: s92
  kind: block
  tag: div
  parent: container
  orig: "\n                1. 传统宏观连续介质力学对比瓶颈 (Navier-Stokes Equations)：\n            "
  text: "\n                1. 传统宏观连续介质力学对比瓶颈 (Navier-Stokes Equations)：\n            "
- key: s93
  kind: block
  tag: div
  parent: container
  orig: "\n                ∂u/∂t + (u · ∇)u = - (1/ρ) ∇p + ν ∇²u + F\n            "
  text: "\n                ∂u/∂t + (u · ∇)u = - (1/ρ) ∇p + ν ∇²u + F\n            "
- key: s94
  kind: block
  tag: div
  parent: container
  orig: "\n                传统宏观计算流体力学 (CFD) 直接离散求解连续非线性偏微分方程组，存在高阶非线性对流项 <code>(u · ∇)u</code> 与全局压力 Poisson 方程求逆的巨大计算瓶颈，网格生成复杂且难以高效实现大规模并行计算。\n            "
  text: "\n                传统宏观计算流体力学 (CFD) 直接离散求解连续非线性偏微分方程组，存在高阶非线性对流项 `(u · ∇)u` 与全局压力 Poisson 方程求逆的巨大计算瓶颈，网格生成复杂且难以高效实现大规模并行计算。\n            "
- key: s95
  kind: block
  tag: div
  parent: container
  orig: "\n                2. 介观动力学模型 (LBGK 单松弛时间演化方程)：\n            "
  text: "\n                2. 介观动力学模型 (LBGK 单松弛时间演化方程)：\n            "
- key: s96
  kind: block
  tag: div
  parent: container
  orig: "\n                f_i(x + e_i · Δt, t + Δt) - f_i(x, t) = - (1/τ) · [ f_i(x, t) - f_i^(eq)(x, t) ]\n            "
  text: "\n                f_i(x + e_i · Δt, t + Δt) - f_i(x, t) = - (1/τ) · [ f_i(x, t) - f_i^(eq)(x, t) ]\n            "
- key: s97
  kind: block
  tag: div
  parent: container
  orig: "\n                基于微观分子动力学 (MD) 与介观动理论，采用统计粒子速度分布函数 <code>f_i(x, t)</code> 描述流体。通过单松弛时间 <code>τ</code> 逼近 Maxwell-Boltzmann 平衡态分布 <code>f_i^(eq)</code>，将连续非线性偏微分方程转化为<strong>局部的代数松弛与相邻格点的数据迁移</strong>。\n            "
  text: "\n                基于微观分子动力学 (MD) 与介观动理论，采用统计粒子速度分布函数 `f_i(x, t)` 描述流体。通过单松弛时间 `τ` 逼近 Maxwell-Boltzmann 平衡态分布 `f_i^(eq)`，将连续非线性偏微分方程转化为**局部的代数松弛与相邻格点的数据迁移**。\n            "
- key: s98
  kind: block

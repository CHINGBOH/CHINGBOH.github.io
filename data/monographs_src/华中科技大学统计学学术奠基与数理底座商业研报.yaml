  orig: <strong>数理学术内核</strong>：大规模矩阵数值直接与迭代求解、偏微分方程有限差分网格离散化；单纯形法、对偶理论、灵敏度分析、网络流运输调度模型、约束满足问题 (CSP)。
  text: '**数理学术内核**：大规模矩阵数值直接与迭代求解、偏微分方程有限差分网格离散化；单纯形法、对偶理论、灵敏度分析、网络流运输调度模型、约束满足问题 (CSP)。'

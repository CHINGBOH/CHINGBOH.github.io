  parent: container
  orig: "\n            在华科 2006 年本科毕业设计阶段，梁清波选择流体力学数值模拟课题：<strong>《格子玻尔兹曼 (Lattice Boltzmann Method, LBM) 算法与流体力学数值模拟》</strong>（由科学计算与偏微分方程数值解导师指导）。\n        "
  text: "\n            在华科 2006 年本科毕业设计阶段，梁清波选择流体力学数值模拟课题：**《格子玻尔兹曼 (Lattice Boltzmann Method, LBM) 算法与流体力学数值模拟》**（由科学计算与偏微分方程数值解导师指导）。\n        "

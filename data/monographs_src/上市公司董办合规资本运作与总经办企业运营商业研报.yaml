- key: s09
  kind: p
  tag: p
  parent: container
  orig: "\n            系统阐述在深圳广田集团股份有限公司（A股主板建筑装饰龙头，SZ.002482）总部的全职管理实践。前期作为<strong>总经理办公室数统专员与运营参谋</strong>（2011.03-2012.02），负责总裁日常经营执行中枢，抓经营管理例会决策、决议动态督办台账（销号率 97.9%）、全司运营信息数据库与年度目标责任书分解，并主笔《建筑装饰行业分析报告》与《同行业上市公司间比较分析》，深度对标金螳螂、亚厦、洪涛等头部竞品；后期晋升并转任<strong>董事会办公室 / 证券事务部核心执行操盘</strong>（2012.03-2014.02，整24个月），直接向分管高管兼董秘（王宏坤，主管全局）与证代（郭文宁）对接汇报，具体承办 12 亿元公司债 55 大类专业尽调底稿封包、首期股票期权 1,113.6 万股行权（2.28 亿自筹资金落地）与二期自主行权推进、超募资金 1.32 亿元产业并购（方特 51% + 成都华南 60%）与新华丰生态并购、牵头承办设立软装子公司（2013.11 董事会审议设立 ➔ 2014.01 完成工商登记，为 2014.02 正式奔赴全资子公司广田云软装担任筹办核心奠定法定基础）、接待华夏/广发/大成/景顺长城等 50+ 场顶级公私募机构现场调研，并在第二届董事会历次三会中落实 10 步刚性合规闭环；在职全周期信披公告 345 篇（证券部专职期 206 篇），深交所信息披露评级持续保持最高 A 级（0 监管问询、0 处罚）。\n        "
  text: "\n            系统阐述在深圳广田集团股份有限公司（A股主板建筑装饰龙头，SZ.002482）总部的全职管理实践。前期作为**总经理办公室数统专员与运营参谋**（2011.03-2012.02），负责总裁日常经营执行中枢，抓经营管理例会决策、决议动态督办台账（销号率 97.9%）、全司运营信息数据库与年度目标责任书分解，并主笔《建筑装饰行业分析报告》与《同行业上市公司间比较分析》，深度对标金螳螂、亚厦、洪涛等头部竞品；后期晋升并转任**董事会办公室 / 证券事务部核心执行统筹**（2012.03-2014.02，整24个月），直接向分管高管兼董秘（王宏坤，主管全局）与证代（郭文宁）对接汇报，具体承办 12 亿元公司债 55 大类专业尽调底稿封包、首期股票期权 1,113.6 万股行权（2.28 亿自筹资金落地）与二期自主行权推进、超募资金 1.32 亿元产业并购（方特 51% + 成都华南 60%）与新华丰生态并购、牵头承办设立软装子公司（2013.11 董事会审议设立 ➔ 2014.01 完成工商登记，为 2014.02 正式奔赴全资子公司广田云软装担任筹办核心奠定法定基础）、接待华夏/广发/大成/景顺长城等 50+ 场顶级公私募机构现场调研，并在第二届董事会历次三会中落实 10 步刚性合规闭环；在职全周期信披公告 345 篇（证券部专职期 206 篇），深交所信息披露评级持续保持最高 A 级（0 监管问询、0 处罚）。\n        "

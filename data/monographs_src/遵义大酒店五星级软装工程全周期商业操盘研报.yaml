  orig: § 1 项目承接与业务协同
  text: § 1 项目承接与业务协同
- key: s50
  kind: li
  tag: li
  parent: container
  orig: <strong>渠道接洽与立项</strong>：依托设计院长期合作关系，在方案阶段介入并对接遵义道桥项目，推动母公司承接 5.0 亿元精装大盘，软装子公司签署 1.25 亿元专业分包合同。
  text: '**渠道接洽与立项**：依托设计院长期合作关系，在方案阶段介入并对接遵义道桥项目，推动母公司承接 5.0 亿元精装大盘，软装子公司签署 1.25 亿元专业分包合同。'
- key: s51
  kind: li
  tag: li
  parent: container
  orig: <strong>母子协同模式</strong>：母公司提供建筑装饰施工资质与大盘承接通道，软装子公司以独立主体签约并独立核算，发挥专业优势。
  text: '**母子协同模式**：母公司提供建筑装饰施工资质与大盘承接通道，软装子公司以独立主体签约并独立核算，发挥专业优势。'
- key: s52
  kind: sec-heading
  tag: h3
  parent: container
  orig: § 2 施工界面清晰划分
  text: § 2 施工界面清晰划分
- key: s53
  kind: li
  tag: li
  parent: container
  orig: <strong>明确施工边界</strong>：大堂挑空主吊灯、客房满铺阻燃地毯纳入硬装母盘；全酒店活动家具、定制艺术灯具、块毯、挂画饰品及布艺花艺纳入软装分包，界面清晰，避免交叉施工争议。
  text: '**明确施工边界**：大堂挑空主吊灯、客房满铺阻燃地毯纳入硬装母盘；全酒店活动家具、定制艺术灯具、块毯、挂画饰品及布艺花艺纳入软装分包，界面清晰，避免交叉施工争议。'
- key: s54
  kind: li
  tag: li
  parent: container
  orig: <strong>独立核算保障</strong>：前置约定权责边界，防止硬装变更或工期问题随意向软装摊派成本，保障分包核算独立。
  text: '**独立核算保障**：前置约定权责边界，防止硬装变更或工期问题随意向软装摊派成本，保障分包核算独立。'
- key: s55
  kind: sec-heading
  tag: h3
  parent: container
  orig: § 3 内部交底与工程协同
  text: § 3 内部交底与工程协同
- key: s56
  kind: li
  tag: li
  parent: container
  orig: <strong>内部交底移交</strong>：商务合同签署后，组织专项交底会议，将图纸方案、工期节点与成本控制目标完整交接给工程部驻场团队。
  text: '**内部交底移交**：商务合同签署后，组织专项交底会议，将图纸方案、工期节点与成本控制目标完整交接给工程部驻场团队。'
- key: s57
  kind: li
  tag: li
  parent: container
  orig: <strong>分工各司其职</strong>：工程部专业团队专注现场排产深化、物流跟进与安装交付；商务端负责款项催收、资金跟踪与竣工结算对账。
  text: '**分工各司其职**：工程部专业团队专注现场排产深化、物流跟进与安装交付；商务端负责款项催收、资金跟踪与竣工结算对账。'
- key: s58
  kind: sec-heading
  tag: h3
  parent: container
  orig: § 4 资金安全与合规把控
  text: § 4 资金安全与合规把控
- key: s59
  kind: li
  tag: li
  parent: container
  orig: <strong>重视资金安全</strong>：不盲目追求合同数字，通过比例联动回款与贴现成本共担等机制，降低大项目的垫资风险。
  text: '**重视资金安全**：不盲目追求合同数字，通过比例联动回款与贴现成本共担等机制，降低大项目的垫资风险。'
- key: s60
  kind: li
  tag: li
  parent: container
  orig: <strong>合规结算确权</strong>：在结算审计阶段以合同约定、供货清单与验收凭据为依据，配合完成 9,300 万元结算审定。
  text: '**合规结算确权**：在结算审计阶段以合同约定、供货清单与验收凭据为依据，配合完成 9,300 万元结算审定。'

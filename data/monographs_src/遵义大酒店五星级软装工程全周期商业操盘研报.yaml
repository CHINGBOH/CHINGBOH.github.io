  text: "\n                **二、 付款联动与资金把控**：针对地方城投回款周期特点，合同前置约定 `分包应收款 = 甲方实收款项 × [1500 ÷ 6000]`（25%）背靠背支付，并明确商票贴现利息按比分摊，从源头控制资金垫付风险。\n            "

# 职业生涯时间线
timeline:
  badge: "CAREER CHRONOLOGY"
  title: "职业生涯时间线与业务演进"
  subtext: "一条主线走下来：从数理统计、合规与数据分析，到定制软装供货商务——始终在'把账算透、把事兑现'。"
  rows:
    - period: "2024.03 - 至今"
      duration: "2年"
      org: "数字化解决方案与商务提效 (独立顾问 / 数字化与工具研发)"
      role: "数字化解决方案顾问 · 把算账与跟单做成工具"
      bullets:
        - "把多年商务里算账、跟单、回款的经验，做成 AI 与自动化工具：数据查询、文档检索、流程自动化，自己用，也给企业用。"
        - "搭建经营数据分析中枢，打通不同业务系统数据，用报表与统计建模支撑报价与决策。"
        - "沉淀一批轻量业务工具（外贸获客、电商数据、门店运营等），覆盖从数据到应用的完整链路。"
      tags: ["AI 提效工具", "数据分析与报表", "统计建模", "报价决策支持", "业务自动化"]
    - period: "2014.03 - 2024.06"
      duration: "10年"
      org: "深圳市广田云软装艺术科技有限公司 (广田全资子公司)"
      role: "定制软装商务 · 从接单报价到摆场回款（兼子公司初创搭建）"
      bullets:
        - '【前端接单与报价】全民营销、有单就做，两种单都打过：一是正式招投标——上海华泰售楼处、陆川九龙山庄改造、中国奥园集团三大战略集采（开发商框架招标，中标后批量供货），清单核算、投标竞标，闭口价一次算准；二是中建四局总包下的政府项目专业分包（红花岗、湄潭），合同开口、总价不锁死，随深化与清单过程议价、审计收口。无论哪种，都穿透源头工坊出厂成本，搭起"出厂成本 ➔ 内部控制 ➔ 商务底限 ➔ 报审报价"的报价防线，大货采购用价值工程 (VE) 刚性降本。'
        - "【中端采购与供货】做的是窗帘、地毯、挂画、艺术品等定制软装货品：逐单深化设计、定制下单，签采购供货合同，按清单把货直供到甲方现场。"
        - "【后端摆场与回款】也到现场干：带队摆场安装，配合设计师完成效果验收；破解背靠背付款条款，过程签证留证，竣工结算上审计据理抗辩、压住审减，把节点回款一笔笔收回。"
        - "【顺带搭班子】生意是老板的，搭班子的事我顺手做：承接超募资金经办全资子公司初创，从 0 到 1 组团队、主笔八大模块管理制度总纲与旗舰展厅，多年用工零仲裁。"
      tags: ["软装采购供货", "定制货品", "严格招投标(闭口)", "开口合同过程议价", "摆场安装", "验收回款"]
    - period: "2011.03 - 2014.02"
      duration: "3年"
      org: "深圳广田装饰集团股份有限公司 (SZ.002482)"
      role: "总经办经营数据分析 ➔ 证券事务部专职 (合规与法定信披)"
      bullets:
        - "前段在总经办搭建经营数据分析模型，督办多期月度经营例会决议按期落实，保障闭环办结。"
        - "后调任证券事务部专职，主导中小企业私募债全流程尽职调查与专业底稿归档；撰写同业竞品财务对标报告；负责深交所法定信披公告，保持零监管函件与最高 A 级考评。"
      tags: ["上市公司合规", "12亿发债尽调", "深交所A级信披", "经营例会决议督办"]
    - period: "2009.07 - 2011.02"
      duration: "1.5年"
      org: "鹏金元金融公司"
      role: "营运部金融产品运营分析"
      bullets:
        - "负责金融产品底层资产数据梳理，协助搭建基础投资风险监测模型与量化测算台账，支撑投资组合动态跟踪与风险测算。"
      tags: ["金融资产运营", "量化测算台账", "风险监测"]
    - period: "2006.07 - 2009.06"
      duration: "3年"
      org: "高柏顾问公司"
      role: "企管部业务流程重构与运营数据分析"
      bullets:
        - "从事企业管理咨询，参与企业业务流程重构 (BPR) 与绩效考核指标体系设计；负责企业运营数据的清洗、建模与统计分析，提供经营报表与测算支持。"
      tags: ["管理咨询BPR", "绩效指标设计", "运营数据分析"]
    - period: "2002.09 - 2006.06"
      duration: "4年"
      org: "华中科技大学 数学与统计学院"
      role: "统计学专业 · 理学学士 (Bachelor of Science)"
      bullets:
        - "系统修读数学分析、高等代数与几何、常微分方程、概率论、数理统计、多元统计分析等数理核心骨干课，修满 160+ 学分。"
        - "本科毕业论文攻关《格子玻尔兹曼 (LBM) 算法与数值模拟》，在 D2Q9 速度空间实现流体介观演化编程，奠定终身受用的数理逻辑与科学计算底座。"
      tags: ["985 理学学士", "24门数理骨干", "LBM 介观模拟", "科学计算"]


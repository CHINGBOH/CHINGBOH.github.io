# 专业能力与技术栈
skills:
  badge: "CORE COMPETENCIES"
  title: "专业能力与技术栈底座"
  subtext: "商务是主场，数据是工具——把定制软装的账算透、把货供好、把钱收回，顺手还能把算账的工具做出来"
  tiles:
    - title: "软装商务与采购供货"
      highlight: true
      items:
        - "定制软装货品（窗帘、地毯、挂画、艺术品等）采购供货全流程"
        - "两种拿单方式都熟：正式招投标（闭口竞标、开发商战略集采）与政府开口合同过程议价"
        - "清单核算与报价测算，穿透源头工坊成本"
        - "采购合同拟定：货品清单、验收标准、付款节点、质保条款"
        - "现场摆场安装统筹，配合设计师完成效果验收"
        - "结算审计抗辩与回款闭环：压审减、防坏账"
    - title: "数据与 AI 工具"
      items:
        - "数据库、BI 报表、统计建模，一人覆盖从分析到落地"
        - "用 AI 做文档检索、报价跟单与业务自动化"
        - "经营指标池与可视化报表搭建，支撑报价与决策"
        - "Python / TypeScript · Git / Linux 高效交付"
    - title: "数理统计与风控测算"
      items:
        - "多元统计分析 · 假设检验 · 回归分析"
        - "运筹最优化 · 线性规划与单纯形法"
        - "底层资产现金流折现测算与量化风控"
    - title: "合规治理与初创搭建（兼）"
      items:
        - "深交所上市公司法定信息披露（考评最高 A 级）"
        - "中小企业私募债及重大融资尽调底稿管理"
        - "总经办经营例会决议闭环督办与跨部门推进"
        - "全资子公司从 0 到 1 组织编制与制度搭建，多年零仲裁"
      period: "2014 - 2024"
      title: "定制软装货品 · 采购供货全链"
      fact: "窗帘、地毯、挂画、艺术品等定制货品，走采购供货合同直供甲方；从接单报价、深化下单到现场摆场、验收回款，每一单从头跟到尾。"

      fact: "遵义大酒店等破亿订单，穿透源头工坊出厂成本做报价，过程签证留证、结算审计据理抗辩，守住审定金额，节点回款落袋。"
      mono: "源头成本底盘 · 多轨报价 · 结算确权 · 回款闭环"

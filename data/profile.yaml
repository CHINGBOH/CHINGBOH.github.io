  headline: "把账算透，把事兑现 · 工程软装商务全链"
  # 用 **xxx** 表示加粗，编译回 <strong>xxx</strong>
  thesis: "多年做下来，其实是同一件事：把一笔账算透，并让它在现实里兑现。在广田云软装，我做的是定制软装货品的采购供货商务——窗帘、地毯、挂画、艺术品，逐单深化、定制下单；前端接单报价——严格招投标的闭口竞标打过，政府项目开口合同、过程议价的也做过；中端签采购合同、定制供货，后端现场摆场、配合设计师验收收款，每一段都亲自做过。生意是老板的，我负责把账算清、把货供好、把钱收回。早年上市公司信披合规与数据分析的底子，加上现在的数据与 AI 工具，让算账更准、兑现更稳。"

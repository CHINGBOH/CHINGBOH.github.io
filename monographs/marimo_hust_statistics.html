      function __resizeIframe(obj) {
        const scrollbarHeight = 20; // Max between windows, mac, and linux

        function setHeight() {
          // Guard against race condition where iframe isn't ready
          if (!obj.contentWindow?.document?.documentElement) {
            return;
          }
          const element = obj.contentWindow.document.documentElement;
          // If there is no vertical scrollbar, we don't need to resize the iframe
          if (element.scrollHeight === element.clientHeight) {
            return;
          }

          // Create a new height that includes the scrollbar height if it's visible
          const hasHorizontalScrollbar = element.scrollWidth > element.clientWidth;
          const newHeight = element.scrollHeight + (hasHorizontalScrollbar ? scrollbarHeight : 0);

          // Only update the height if it's different from the current height
          if (obj.style.height !== `${newHeight}px`) {
            obj.style.height = `${newHeight}px`;
          }
        }

        // Resize the iframe to the height of the content and bottom scrollbar height
        setHeight();

        // Resize the iframe when the content changes
        const resizeObserver = new ResizeObserver((_entries) => {
          setHeight();
        });
        // Only observe if iframe content is ready
        if (obj.contentWindow?.document?.body) {
          resizeObserver.observe(obj.contentWindow.document.body);
        }
      }
    </script>

"}]}, {"code_hash": "1ab67192e5494bd91226dcc463216949", "console": [], "id": "Xref", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "fb99a09ee0350317cd7b6e916b06083b", "console": [], "id": "SFPL", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "e025dad9182eddf6796ae9d7da741fe8", "console": [], "id": "BYtC", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "cc9d1a9c716acc8f95842f88702f541d", "console": [], "id": "RGSE", "outputs": [{"data": {"text/html": "\u003Cdiv style='display: flex;flex: 1;flex-direction: column;justify-content: flex-start;align-items: normal;flex-wrap: nowrap;gap: 0.5rem'\u003E\n\u003Cstyle\u003E\n  .marimo-app {\n    font-family: \"Latin Modern Roman\", \"Computer Modern Serif\", \"Noto Serif SC\", \"Source Han Serif SC\", Georgia, \"Times New Roman\", serif !important;\n    background-color: #ffffff !important;\n    color: #1e293b !important;\n    line-height: 1.7 !important;\n  }\n\n  h1, h2, h3, h4 {\n    font-family: \"Latin Modern Roman\", \"Computer Modern Serif\", \"Noto Serif SC\", serif !important;\n    font-weight: 700 !important;\n    letter-spacing: -0.01em !important;\n    color: #0f172a !important;\n  }\n\n  table {\n    font-family: \"Latin Modern Roman\", \"Noto Serif SC\", serif !important;\n    border-collapse: collapse !important;\n  }\n\n  code, pre, .mono-num {\n    font-family: \"Latin Modern Mono\", \"Computer Modern Typewriter\", \"JetBrains Mono\", monospace !important;\n  }\n\n  *, *::before, *::after {\n    box-sizing: border-box !important;\n  }\n\n  svg, .chart-card svg, .marimo-app svg {\n    width: 100% !important;\n    max-width: 100% !important;\n    height: auto !important;\n    display: block !important;\n    margin: 0 auto !important;\n  }\n\n  [style*=\"display:grid\"], [style*=\"display: grid\"], [style*=\"display:flex\"], [style*=\"display: flex\"] {\n    box-sizing: border-box !important;\n    max-width: 100% !important;\n  }\n 03E\u534e\u4e2d\u79d1\u6280\u5927\u5b66\u7edf\u8ba1\u5b66\u5b66\u672f\u5960\u57fa\u4e0e\u6570\u7406\u7b97\u6cd5\u5e95\u5ea7\u5168\u606f\u7814\u62a5\u003C/h1\u003E\n    \u003Cdiv style=\"font-size:13.5px; color:#475569; line-height:1.6;\"\u003E\n        \u4f9d\u6258\u6570\u5b66\u4e0e\u7edf\u8ba1\u5b66\u9662\u6b63\u7edf\u7406\u5b66\u5b66\u58eb\u57f9\u517b\u4f53\u7cfb\u4e0e\u300a\u683c\u5b50\u73bb\u5c14\u5179\u66fc (LBM) \u7b97\u6cd5\u4e0e\u6570\u503c\u6a21\u62df\u300b\u6bd5\u4e1a\u79d1\u7814\u653b\u575a\uff0c\u4ee5\u4ea4\u4e92\u5f0f\u4ecb\u89c2\u52a8\u529b\u5b66\u6a21\u62df\u5668\u4e0e\u51fa\u7248\u7ea7\u77e2\u91cf\u56fe\u8868\uff0c\u5b9e\u8bc1\u5448\u73b0\u56db\u5e74 160+ \u5b66\u5206\u5bf9\u4e8c\u5341\u5e74\u4e0a\u5e02\u516c\u53f8\u8d44\u672c\u8fd0\u4f5c\u30012 \u4ebf\u5b9e\u4f53\u4f9b\u5e94\u94fe\u5927\u76d8\u4e0e AI \u6e56\u4ed3\u5de5\u7a0b\u7814\u53d1\u7684\u5e95\u5c42\u6570\u7406\u652f\u6491\u3002\n    \u003C/div\u003E\n\u003C/div\u003E\n\n\u003Cdiv style=\"background:#f8fafc; border:1px solid #cbd5e1; border-left:4px solid #1e3a8a; padding:12px 18px; border-radius:6px; font-size:13px; color:#1e293b; line-height:1.6; margin-bottom:16px;\"\u003E\n    \ud83c\udfdb\ufe0f \u003Cstrong\u003E\u534e\u4e2d\u79d1\u6280\u5927\u5b66\uff08985\u5de5\u7a0b / \u53cc\u4e00\u6d41\uff09\u6570\u5b66\u4e0e\u7edf\u8ba1\u5b66\u9662 \u00b7 2002 \u7ea7\u9996\u5c4a\u7edf\u8ba1\u5b66\u4e13\u4e1a \u00b7 \u7406\u5b66\u5b66\u58eb (B.S.)\u003C/strong\u003E \u0026nbsp;|\u0026nbsp; \n    \u003Cspan style=\"color:#059669; font-weight:700;\"\u003E\u57f9\u517b\u89c4\u683c\uff1a\u56db\u5e74 160+ \u5b66\u5206 \u00b7 30+ \u95e8\u6570\u7406\u8ba1\u7b97\u673a\u8bfe\u7a0b \u00b7 LBM \u6bd5\u4e1a\u79d1\u7814\u653b\u575a\u003C/span\u003E \u0026nbsp;|\u0026nbsp; \n    \u003Cspan style=\"color:#2563eb; font-weight:600;\"\u003E\u5f53\u524d\u4ecb\u89c2\u4eff\u771f\u53c2\u91cf\uff1a\u03c4 = 0.60 \u00b7 \u03bd = 0.0333 \u00b7 U_lid = 0.08 \u00b7 Re = 76.8\u003C/span\u003E\n\u003C/div\u003E\n\n\u003Cdiv style=\ u601d\u60f3\u6df1\u523b\u542f\u793a\u003C/strong\u003E\uff1a\u003Cbr/\u003E\n                1. \u003Cstrong\u003E\u53bb\u4e2d\u5fc3\u5316\u72b6\u6001\u673a\u540c\u6784\u003C/strong\u003E\uff1a\u6bcf\u4e2a\u683c\u70b9\u4ec5\u6309\u4ee3\u6570\u89c4\u5219\u5c40\u90e8\u6f14\u5316\uff0c\u81ea\u53d1\u5f62\u6210\u5b8f\u89c2\u590d\u6742\u6d41\u52a8\uff0c\u4e0e\u73b0\u4ee3 \u003Cstrong\u003EAI Agent \u72b6\u6001\u56fe\u673a (LangGraph/Swarm)\u003C/strong\u003E \u7684\u72b6\u6001\u8f6c\u79fb\u601d\u60f3\u5b8c\u5168\u4e00\u81f4\uff1b\u003Cbr/\u003E\n                2. \u003Cstrong\u003E\u9ad8\u5e76\u53d1\u8fde\u7eed\u5185\u5b58\u5c40\u90e8\u6027\u003C/strong\u003E\uff1a\u8fde\u7eed\u7269\u7406\u6570\u7ec4\u907f\u514d\u7f13\u5b58\u5931\u6548\uff0c\u690d\u5165\u4e86\u5bf9 \u003Cstrong\u003EDuckDB \u5217\u5f0f\u5411\u91cf\u5316\u6267\u884c\u3001Parquet \u5206\u7247\u003C/strong\u003E \u7684\u5e95\u5c42\u7269\u7406\u611f\u77e5\u3002\n            \u003C/div\u003E\n        \u003C/div\u003E\n    \u003C/div\u003E\n    \u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch4 id=\"vs\"\u003E\ud83d\udcca \u5b8f\u89c2\u8fde\u7eed\u4ecb\u8d28 vs \u4ecb\u89c2\u79bb\u6563\u52a8\u529b\u5b66\u5bf9\u6807\u003C/h4\u003E\n\u003Ctable\u003E\n\u003Cthead\u003E\n\u003Ctr\u003E\n\u003Cth style=\"text-align: left;\"\u003E\u7ef4\u5ea6\u6307\u6807\u003C/th\u003E\n\u003Cth style=\"text-align: left;\"\u003E\u4f20\u7edf\u5b8f\u89c2 CFD (Navier-Stokes)\u003C/th\u003E\n\u003Cth style=\"text-align: left;\"\u003E\u4ecb\u89c2\u52a8\u529b\u5b66 (Lattice Boltzmann Method)\u003C/th\u003E\n\u003Cth style=\"text-align: left;\"\u003E\u73b0\u4ee3\u8f6f\u4ef6\u4e0e AI \u5de5\u7a0b\u6620\u5c04\u003C/th\u003E\n\u003C/tr\u003E\n\u003C/thead\u003E\n\u003Ctbody\u003E\n\u003Ctr\u003E\n\u003Ctd style=\"text-align: left;\"\u003E\u003Cstrong\u003E\u63a7\u5236\u65b9\u7a0b\u003C/strong\u003E\u003C/td\u003E\n\u003Ctd style=\"text-align: left;\"\u003E\u003Cmarimo-tex class=\"arithmatex\"\u003E||(\\frac{\\partia

      function __resizeIframe(obj) {
        const scrollbarHeight = 20; // Max between windows, mac, and linux

        function setHeight() {
          // Guard against race condition where iframe isn't ready
          if (!obj.contentWindow?.document?.documentElement) {
            return;
          }
          const element = obj.contentWindow.document.documentElement;
          // If there is no vertical scrollbar, we don't need to resize the iframe
          if (element.scrollHeight === element.clientHeight) {
            return;
          }

          // Create a new height that includes the scrollbar height if it's visible
          const hasHorizontalScrollbar = element.scrollWidth > element.clientWidth;
          const newHeight = element.scrollHeight + (hasHorizontalScrollbar ? scrollbarHeight : 0);

          // Only update the height if it's different from the current height
          if (obj.style.height !== `${newHeight}px`) {
            obj.style.height = `${newHeight}px`;
          }
        }

        // Resize the iframe to the height of the content and bottom scrollbar height
        setHeight();

        // Resize the iframe when the content changes
        const resizeObserver = new ResizeObserver((_entries) => {
          setHeight();
        });
        // Only observe if iframe content is ready
        if (obj.contentWindow?.document?.body) {
          resizeObserver.observe(obj.contentWindow.document.body);
        }
      }
    </script>

            "session": {"cells": [{"code_hash": "19149e61e1fade36f8c4d8127798c23f", "console": [], "id": "Hbol", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "7b2acf090f810545faeac9401dafef66", "console": [], "id": "MJUe", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "60cb2917b9cbcab7cb667ce65e415a16", "console": [], "id": "vblA", "outputs": [{"data": {"text/html": "\u003Cmarimo-sidebar \u003E\u003Cdiv style='display: flex;flex: 1;flex-direction: column;justify-content: flex-start;align-items: normal;flex-wrap: nowrap;gap: 0.5rem'\u003E\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch3 id=\"_1\"\u003E\ud83c\udfdb\ufe0f \u9ad8\u7ba1\u6863\u6848\u4e0e\u4e1a\u52a1\u603b\u89c8\u003C/h3\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Cem\u003E\u5e7f\u7530\u4e91\u8f6f\u88c5 \u00b7 \u5168\u8d44\u5b50\u516c\u53f8\u5341\u5e74\u4e13\u6848\u5178\u85cf\u003C/em\u003E\u003C/span\u003E\n\u003Chr /\u003E\n\u003Ch4 id=\"_2\"\u003E\ud83c\udfe2 \u5b9e\u4f53\u6cd5\u4eba\u80cc\u666f\u003C/h4\u003E\n\u003Cul\u003E\n\u003Cli\u003E\u003Cstrong\u003E\u4f01\u4e1a\u540d\u79f0\u003C/strong\u003E\uff1a\u6df1\u5733\u5e02\u5e7f\u7530\u4e91\u8f6f\u88c5\u79d1\u6280\u6709\u9650\u516c\u53f8\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003E\u6cd5\u5b9a\u8d44\u8d28\u003C/strong\u003E\uff1a\u5e7f\u7530\u96c6\u56e2\uff08SZ.002482\uff09\u5168\u8d44\u5b50\u516c\u53f8\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003E\u6ce8\u518c\u8d44\u672c\u003C/strong\u003E\uff1a\u003Cstrong\u003E3,000.00 \u4e07\u5143\u003C/strong\u003E\uff08\u8d85\u52df\u8d44\u91d1\u5b9e\u7f34\uff09\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003E\u6210\u7acb\u65f6\u95f4\u003C/strong\u003E\uff1a2014 \u5e74 2 \u6708\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003E\u603b\u90e8\u57fa\u5730\u003C/strong\u003E\uff1a\u6df1\u5733\u76db\u534e\u5927\u53a6 / \u7f57\u6e56\u827a\u5c55\u4e2d\u5fc3\u003C/li\u003E\n\u003C/ul\u003E\n\u003Chr /\u003E\n\u003Ch4 id=\"_3\"\u003E\ud83d\udc64 \u6881\u6e05\u6ce2 \u6838\u5fc3\u4efb\u804c\u5c65\u5386\u003C/h4\u003E\n\u003Cul\u003E\n\u003Cli\u003E\u003Cstrong\u003E\u5168\u8d44\u5b50\u516c\u53f8\u521d\u521b\u6838\u5fc3\u7b79\u529e\u4eba (2014-2015)\u003C/strong\u003E\uff1a\u003Cul\u003E\n\u003Cli\u003E\u4e3b\u6301\u8d77\u8349\u516b\u5927\u6a21\u5757 \u003Cstrong\u003E730 \u6761\u003C/strong\u003E \u521a\u6027\u7ba1\u7406\u5236\u5ea6\uff1b\u003C/li\u003E\n\u003Cli\u003E\u4ece 0 \u5230 1 \u7ec4\u5efa \u003Cstrong\u003E45 \u4eba\u003C/strong\u003E \u8de8\u804c\u7cfb\u7cbe\u5e72\u7f16\u5236\uff1b\u003C/li\u003E\n\u003Cli\u003E\u6253\u9020\u7f57\u6e56\u827a\u5c55\u4e2d\u5fc3 \u003Cstrong\u003E1,491 \u33a1\u003C/strong\u003E \u6c89\u6d78\u5f0f\u7f8e\u5b66\u5c55\u5385\uff1b\u003C/li\u003E\n\u003Cli\u003E\u5b9e\u73b0\u52b3\u52a8\u5408\u540c 100% \u524d\u7f6e\u7b7e\u7f72\u4e0e\u5341\u5e74\u8de8\u5ea6\u003Cstrong\u003E\u96f6\u52b3\u52a8\u4ef2\u88c1\u003C/strong\u003E\u3002\u003C/li\u003E\n\u003C/ul\u003E\n\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003E\u6807\u6746\u5de5\u7a0b\u654f\u6377\u4e13\u73ed\u7275\u5934\u4eba (2015-2024)\u003C/strong\u003E\uff1a\u003Cul\u003E\n\u003Cli\u003E\u4eb2\u81ea\u4e3b\u64cd\u9075\u4e49\u5927\u9152\u5e97 1.25 \u4ebf\u6bcd\u76d8\u3001\u9075\u4e49\u6e44\u6c5f\u6e29\u6cc9 3,380 \u4e07\u3001\u7ea2\u82b1\u5c97\u57ce\u5e02\u7efc\u5408\u4f53 3,112.5 \u4e07\u3001\u4e0a\u6d77\u534e\u6cf0\u552e\u697c\u5904 156.66 \u4e07\u3001\u9646\u5ddd\u4e5d\u9f99\u5c71\u5e84 550 \u4e07\u7b49\u6838\u5fc3\u9879\u76ee\u3002\u003C/li\u003E\n\u003C/ul\u003E\n\u003C/li\u003E\n\u003C/ul\u003E\n\u003Chr /\u003E\n\u003Ch4 id=\"_4\"\u003E\ud83d\udcd1 \u7814\u62a5\u5377\u5b97\u56db\u5927\u677f\u5757\u003C/h4\u003E\n\u003Col\u003E\n\u003Cli\u003E\ud83c\udfdb\ufe0f \u5168\u666f\u6df1\u5ea6\u5546\u4e1a\u7814\u62a5\u003C/li\u003E\n\u003Cli\u003E\ud83d\udc65 \u521d\u521b\u67b6\u6784\u4e0e 730 \u6761\u5236\u5ea6\u5e95\u7ec6\u003C/li\u003E\n\u003Cli\u003E\ud83d\udcd1 24 \u5927\u6807\u6746\u5de5\u7a0b\u4e0e\u516c\u53f8 135 \u4efd\u5e95\u8d26\u003C/li\u003E\n\u003Cli\u003E\u2696\ufe0f \u6cd5\u5b9a\u521d\u521b\u8d44\u8d28\u4e0e\u5ba1\u8ba1\u5377\u5b97\u7d22\u5f15\u003C/li\u003E\n\u003C/ol\u003E\u003C/span\u003E\u003C/div\u003E\u003C/marimo-sidebar\u003E"}, "type": "data"}]}, {"code_hash": "900821547ec8e729b2a846708e13ab2e", "console": [], "id": "bkHC", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "ef6c90429dee3c30c2daf01ca79c9fd2", "console": [], "id": "lEQa", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "11b2683d05d60bcf28d43c3ad64f400e", "console": [], "id": "PKri", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "ce6865251d0b23c282e998d8a80926c2", "console": [], "id": "Xref", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "4b615fa5887be87a1c0332870ba16ff1", "console": [], "id": "SFPL", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "ec136990d70761dac77b128a0b901868", "console": [], "id": "BYtC", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "7816d698f5a6158c434fc6e15bebd003", "console": [], "id": "RGSE", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "01db0d5bbebad67bf15ad65e757c3714", "console": [], "id": "Kclp", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "44f9353ce87f716213986504c07332df", "console": [], "id": "emfo", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "cc9d1a9c716acc8f95842f88702f541d", "console": [], "id": "Hstk", "outputs": [{"data": {"text/html": "\u003Cdiv style='display: flex;flex: 1;flex-direction: column;justify-content: flex-start;align-items: normal;flex-wrap: nowrap;gap: 0.5rem'\u003E\n\u003Cstyle\u003E\n  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700;900\u0026family=JetBrains+Mono:wght@400;500;700\u0026display=swap');\n\n  body, .marimo-app, h1, h2, h3, h4, h5, h6, p, li, blockquote, div {\n    font-family: \"Latin Modern Roman\", \"Computer Modern Serif\", \"Noto Serif SC\", \"Source Han Serif SC\", \"SimSun\", serif !important;\n  }\n\n  h1, h2, h3 {\n    color: #0f172a !important;\n    letter-spacing: -0.01em;\n  }\n\n  blockquote {\n    border-left: 3px solid #162a45 !important;\n    background: #f8fafc !important;\n    padding: 10px 16px !important;\n    border-radius: 0 6px 6px 0 !important;\n    color: #334155 !important;\n    font-style: italic;\n  }\n\n  table {\n    font-family: \"Latin Modern Roman\", \"Noto Serif SC\", serif !important;\n    border-collapse: collapse !important;\n  }\n\n  code, pre, .mono-num {\n    font-family: \"Latin Modern Mono\", \"Computer Modern Typewriter\", \"JetBrains Mono\", monospace !important;\n  }\n\n  /* \u5f3a\u5236\u6240\u6709\u56fe\u8868\u5177\u5907 100% \u5bb9\u5668\u81ea\u9002\u5e94\u7f29\u653e\u4e0e\u5f39\u6027\u4f38\u7f29 */\n  *, *::before, *::after {\n    box-sizing: border-box !important;\n  }\n\n  svg {\n    max-width: 100% !important;\n    height: auto !important;\n    width: 100% !important;\n    display: block !important;\n  }\n\n  img {\n    max-width: 100% !important;\n    height: auto !important;\n    display: block !important;\n  }\n\n  [style*=\"display:grid\"], [style*=\"display: grid\"], [style*=\"display:flex\"], [style*=\"display: flex\"] {\n    box-sizing: border-box !important;\n    max-width: 100% !important;\n  }\n\n  [style*=\"display:grid\"] \u003E div, [style*=\"display: grid\"] \u003E div, [style*=\"display:flex\"] \u003E div, [style*=\"display: flex\"] \u003E div {\n    min-width: 0 !important;\n    max-width: 100% !important;\n    box-sizing: border-box !important;\n  }\n\n  [data-radix-toast-viewport], ol[tabindex=\"-1\"], li[role=\"status\"], a[href*=\"marimo-team/marimo\"], a[href*=\"marimo.io\"] {\n    display: none !important;\n  }\n\u003C/style\u003E\n\n\u003Cdiv style=\"border-bottom:1px solid #e2e8f0; padding-bottom:16px; margin-bottom:20 \u9a8c\u6536 + 5%\u8d28\u4fdd\u91d1\u003C/code\u003E\uff0c\u51fa\u8d27\u6216\u5230\u573a\u5373\u6536\u56de 80% \u73b0\u91d1\u6d41\uff0c\u003Cstrong\u003E\u8d85\u989d\u8986\u76d6\u51fa\u5382\u76f4\u63a5\u6210\u672c 140%~150%\u003C/strong\u003E\uff0c\u7b51\u7262\u8d44\u91d1\u5b89\u5168\u7ebf\uff1b\u003C/li\u003E\n\u003C/ul\u003E\n\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003E3. \u6781\u901f\u8986\u76d6\u98ce\u63a7\u578b\uff08\u4e0a\u6d77\u534e\u6cf0\u552e\u697c\u5904 156.66 \u4e07 / \u5bbe\u9633\u534e\u7f8e\u8fbe 108.28 \u4e07\uff09\u003C/strong\u003E\uff1a\u003Cul\u003E\n\u003Cli\u003E\u5b9e\u884c \u003Ccode\u003E30%\u5b9a\u91d1 + 40%\u6392\u4ea7\u51fa\u8d27\u524d\u4ed8\u6e05\uff08\u7d2f\u8ba170%~90%\uff09\u003C/code\u003E\uff0c\u4ea7\u54c1\u79bb\u5f00\u73e0\u4e09\u89d2\u5de5\u5382\u524d\u5373\u5b9e\u73b0\u8d44\u91d1\u56de\u6b63\uff0c\u771f\u6b63\u5b9e\u73b0\u96f6\u57ab\u8d44\u4ea4\u4ed8\uff1b\u003C/li\u003E\n\u003C/ul\u003E\n\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003E4. \u6218\u91c7\u7edf\u7b79\u534f\u540c\u578b\uff08\u6052\u5927\u5168\u56fd\u6218\u91c7 3,250 \u4e07 / \u4e2d\u56fd\u5965\u56ed\u4e09\u5927\u6218\u91c7 225.65 \u4e07\uff09\u003C/strong\u003E\uff1a\u003Cul\u003E\n\u003Cli\u003E\u96c6\u56e2\u603b\u90e8\u6846\u67b6\u534f\u8bae\u9501\u5b9a\u57fa\u51c6\u6bdb\u5229\u7387\u4e0e\u9636\u68af\u8ba9\u5229\uff0c\u5c5e\u5730\u5316\u9879\u76ee\u5206\u6279\u4f9b\u8d27\u3001\u5206\u6bb5\u786e\u6743\u3001\u6d41\u6c34\u5f0f\u7ed3\u7b97\u56de\u6b3e\u3002\u003C/li\u003E\n\u003C/ul\u003E\n\u003C/li\u003E\n\u003C/ul\u003E\n\u003Chr /\u003E\n\u003Ch3 id=\"4-task-force\"\u003E\u00a7 4 \u5927\u9879\u76ee\u654f\u6377\u4e13\u73ed (Task Force) \u4e0e\u7aef\u5230\u7aef\u4e0b\u6c89\u5b9e\u64cd\u003C/h3\u003E\n\u003Cul\u003E\n\u003Cli\u003E\u003Cstrong\u003E\u7ec4\u7ec7\u534f\u540c\u673a\u5236\u003C/strong\u003E\uff1a\u6253\u7834\u79d1\u5c42\u58c1\u5792\uff0c\u62bd\u8c03\u8bbe\u8ba1\u3001\u9020\u4ef7\u3001\u5de5\u7a0b\u3001\u91c7\u8d2d\u7cbe\u5e72\u4eba\u5458\u7ec4\u5efa\u65

      function __resizeIframe(obj) {
        const scrollbarHeight = 20; // Max between windows, mac, and linux

        function setHeight() {
          // Guard against race condition where iframe isn't ready
          if (!obj.contentWindow?.document?.documentElement) {
            return;
          }
          const element = obj.contentWindow.document.documentElement;
          // If there is no vertical scrollbar, we don't need to resize the iframe
          if (element.scrollHeight === element.clientHeight) {
            return;
          }

          // Create a new height that includes the scrollbar height if it's visible
          const hasHorizontalScrollbar = element.scrollWidth > element.clientWidth;
          const newHeight = element.scrollHeight + (hasHorizontalScrollbar ? scrollbarHeight : 0);

          // Only update the height if it's different from the current height
          if (obj.style.height !== `${newHeight}px`) {
            obj.style.height = `${newHeight}px`;
          }
        }

        // Resize the iframe to the height of the content and bottom scrollbar height
        setHeight();

        // Resize the iframe when the content changes
        const resizeObserver = new ResizeObserver((_entries) => {
          setHeight();
        });
        // Only observe if iframe content is ready
        if (obj.contentWindow?.document?.body) {
          resizeObserver.observe(obj.contentWindow.document.body);
        }
      }
    </script>

c2b45648'\u003E\u003Cmarimo-radio data-initial-value='\u0026quot;\u5168\u666f\u603b\u89c8 (2002 - 2026)\u0026quot;' data-label='\u0026quot;\u0026#92;u003cspan class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026#92;u003e\u0026#92;u003cspan class=\u0026#92;\u0026quot;paragraph\u0026#92;\u0026quot;\u0026#92;u003e\u751f\u6daf\u5168\u666f\u9636\u6bb5\u5bfc\u822a\u0026#92;u003c/span\u0026#92;u003e\u0026#92;u003c/span\u0026#92;u003e\u0026quot;' data-options='[\u0026quot;\u5168\u666f\u603b\u89c8 (2002 - 2026)\u0026quot;,\u0026quot;\ud83c\udf93 \u534e\u79d1\u7edf\u8ba1\u5b66\u5b66\u672f\u5960\u57fa (2002-2006)\u0026quot;,\u0026quot;\ud83c\udfdb\ufe0f \u4e0a\u5e02\u516c\u53f8\u8463\u529e\u4e0e\u603b\u7ecf\u529e (2011-2014)\u0026quot;,\u0026quot;\ud83c\udfe2 \u5e7f\u7530\u4e91\u5b9e\u4f53\u91c7\u9500\u5927\u76d8 (2014-2024)\u0026quot;,\u0026quot;\ud83d\udcbb \u73b0\u4ee3\u81ea\u4e3bAI\u6e56\u4ed3\u5de5\u7a0b (2024-\u81f3\u4eca)\u0026quot;]' data-inline='false' data-disabled='false'\u003E\u003C/marimo-radio\u003E\u003C/marimo-ui-element\u003E\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Chr style='margin: 14px 0; border: none; border-top: 1px dashed rgba(22,42,69,0.15);'\u003E\u003C/span\u003E\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch4 id=\"_1\"\u003E\ud83c\udfaf \u56db\u5927\u6838\u5fc3\u4ef7\u503c\u652f\u67f1\u7d22\u5f15\u003C/h4\u003E\u003C/span\u003E\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cdiv style=\"background: #faf8f5; border: 1px solid rgba(138,104,57,0.2); border-radius: 4px; padding: 10px 12px; margin-bottom: 12px; font-size: 11.5px; line-height: 1.6; color: #334155;\"\u003E\n    \u003Cdiv style=\"margin-bottom: 6px;\"\u003E\n        \u003Cstrong style=\"color: #8a6839;\"\u003E\u2460 \u6210\u672c\u7a7f\u900f\u003C/strong\u003E (2014-2024)\u003Cbr\u003E\n        \u003Cspan style=\"color: #162a45; font-weight: 600;\"\u003E\u6210\u672c\u7a7f\u900f\u4e0e\u5229\u6da6\u9020\u8840\u003C/span\u003E \u00b7 \u5b88\u4f4f 30%~35% \u6bdb\u5229\n    \u003C/div\u003E\n    \u003Cdiv style=\"margin-bottom: 6px;\"\u003E\n        \u003Cstrong style=\"color: #8a6839;\"\u003E\u2461 \u8fc7\u7a0b\u98ce\u63a7\u003C/strong\u003E (2014-2024)\u003Cbr\u003E\n        \u003Cspan style=\"color: #162a45; font-weight: 600;\"\u003E\u8fc7\u7a0b\u98ce\u63a7\u4e0e\u786e\u6743\u56de\u6b3e\u003C/span\u003E \u00b7 \u7b7e\u8bc1\u5ba1\u8ba1\u95ed\u73af\n    \u003C/div\u003E\n    \u003Cdiv style=\"margin-bottom: 6px;\"\u003E\n        \u003Cstrong style=\"color: #8a6839;\"\u003E\u2462 \u9876\u5c42\u6cbb\u7406\u003C/strong\u003E (2011-2014)\u003Cbr\u003E\n        \u003Cspan style=\"color: #162a45; font-weight: 600;\"\u003E\u9876\u5c42\u6cbb\u7406\u4e0e\u5408\u89c4\u5e95\u76d8\u003C/span\u003E \u00b7 206\u7bc7A\u7ea7\u4fe1\u62ab/12\u4ebf\u503a\n    \u003C/div\u003E\n    \u003Cdiv\u003E\n        \u003Cstrong style=\"color: #8a6839;\"\u003E\u2463 \u6570\u5b57\u5316\u6760\u6746\u003C/strong\u003E (2024-\u81f3\u4eca)\u003Cbr\u003E\n        \u003Cspan style=\"color: #162a45; font-weight: 600;\"\u003E\u6570\u5b57\u5316\u81ea\u4e3b\u6784\u5efa\u6760\u6746\u003C/span\u003E \u00b7 DuckDB\u6e56\u4ed3/2800\u4e07\u884c\n    \u003C/div\u003E\n\u003C/div\u003E\u003C/span\u003E\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Chr style='margin: 14px 0; border: none; border-top: 1px dashed rgba(22,42,69,0.15);'\u003E\u003C/span\u003E\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch4 id=\"_1\"\u003E\ud83c\udfdb\ufe0f \u5ba1\u8ba1\u7ea7\u6e56\u4ed3\u5355\u4e00\u771f\u5b9e\u6e90\u003C/h4\u003E\u003C/span\u003E\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cdiv style=\"font-size: 11px; color: #64748b; line-height: 1.6;\"\u003E\n    \u5168\u91cf\u6570\u636e\u76f4\u8fde\u672c\u5730 DuckDB Direct-Lake \u003Cstrong\u003E37 \u4e2a\u7269\u7406\u6e56\u4ed3\u89c6\u56fe\u003C/strong\u003E\uff0c  [{"data": {"text/html": "\u003Cdiv style='display: flex;flex: 1;flex-direction: column;justify-content: flex-start;align-items: normal;flex-wrap: nowrap;gap: 0.5rem'\u003E\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cstyle\u003E\n  *, *::before, *::after {\n    box-sizing: border-box !important;\n  }\n  svg {\n    width: 100% !important;\n    max-width: 100% !important;\n    height: auto !important;\n    display: block !important;\n  }\n  img {\n    max-width: 100% !important;\n    height: auto !important;\n  }\n  [style*=\"display:grid\"], [style*=\"display: grid\"], [style*=\"display:flex\"], [style*=\"display: flex\"] {\n    box-sizing: border-box !important;\n    max-width: 100% !important;\n  }\n  [style*=\"display:grid\"] \u003E div, [style*=\"display: grid\"] \u003E div, [style*=\"display:flex\"] \u003E div, [style*=\"display: flex\"] \u003E div {\n    min-width: 0 !important;\n    max-width: 100% !important;\n    box-sizing: border-box !important;\n  }\n  [data-radix-toast-viewport], ol[tabindex=\"-1\"], li[role=\"status\"], a[href*=\"marimo-team/marimo\"], a[href*=\"marimo.io\"] {\n    display: none !important;\n  }\n\u003C/style\u003E\n\u003Cdiv style=\"border-bottom: 1px solid rgba(22, 42, 69, 0.12); padding-bottom: 24px; margin-bottom: 24px;\"\u003E\n    \u003C!-- \u6863\u6848\u9898\u7709 --\u003E\n    \u003Cdiv style=\"display: flex; justify-content: space-between; align-items: center; font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #8a6839; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 10px;\"\u003E\n        \u003Cspan\u003EBOONE LIANG / PROFESSIONAL PORTFOLIO / SELECTED WORK\u003C/span\u003E\n        \u003Cspan\u003EARCHIVAL DOSSIER \u00b7 MASTER BI\u003C/span\u003E\n    \u003C/div\u003E\n\n    \u003C!-- \u4e3b\u5b98\u62ac\u5934\u4e0e\u8054\u7cfb\u4fe1\u606f --\u003E\n    \u003Cdiv style=\"display: flex; justify-content: space-between; align-items: baseline; flex-wrap
